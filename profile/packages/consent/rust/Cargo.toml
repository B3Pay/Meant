[package]
name = "candid-profile-consent"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Consent and SNS validator texts from a Candid Profile resolved form; the Rust version of packages/consent, for canisters."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
candid = { version = "=0.10.38", default-features = false, features = ["value"] }
num-bigint = "=0.4.6"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
unicode-general-category = "=1.1.0"
ryu-js = "=1.0.3"

[[example]]
name = "sns_validator"
crate-type = ["cdylib"]

[[example]]
name = "sns_target"
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Its own workspace root, wherever it sits. In B3Pay/Meant, under profile/ (D-052), cargo would otherwise take that
# repository's root manifest for this crate's workspace and refuse to build it ("current package believes it's in a
# workspace when it's not"); that root lists "." among its members, so its `exclude` cannot leave this crate out. As
# a root, the crate also keeps its [profile.release], which cargo reads only from a workspace root.
[workspace]
