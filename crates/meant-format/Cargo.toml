[package]
name = "meant-format"
# Pre-1.0, like everything in this repository: any 0.x release may change the
# public API and the text `display` produces. Consumers should pin an exact
# version (`meant-format = "=0.1.0"`), as they do for `meant`.
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Exact conversion between the amounts people write and the base units a contract call carries. Never rounds."
license = "Apache-2.0"
repository = "https://github.com/B3Pay/Meant"
readme = "README.md"
keywords = ["amount", "decimals", "token", "no-rounding", "no-std"]
categories = ["value-formatting", "no-std", "cryptography::cryptocurrencies"]
# A positive allowlist, for the reason the root package gives: a new file stays
# out of the published archive until it is named here on purpose. Tests and
# their vectors never ship.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[features]
default = ["std"]
# Only adds `impl std::error::Error for FormatError`. Without it the crate is
# `no_std` and needs only `alloc`, for hardware signers and other targets with
# no standard library. (`core::error::Error` would make this feature
# unnecessary, but it needs Rust 1.81 and this crate's floor is 1.78.)
std = []

[dependencies]
# None, on purpose: the crate does exact decimal arithmetic on strings, so it
# needs no big-integer library, and a value converter in a signing path should
# add nothing to a consumer's supply chain.

[dev-dependencies]
# Reads the parity vectors generated from the JavaScript reference. The same
# exact pin as the root package's, so the lockfile keeps one serde_json.
# Dev-only: it never reaches a consumer.
serde_json = "=1.0.150"
