# Publishing the five library packages of profile/ (@meantjs/profile, /format, /consent, /tools, /reconcile),
# dispatch-only. Modeled on this repository's npm-release.yml, because npm names and versions are permanent:
#
# - inputs are shape-checked before anything touches the network, and reach scripts through `env:`, never through
#   `${{ }}` inside `run:`;
# - `commit` must be a full SHA reachable from `origin/main`, so the bytes the verify job proved are the bytes the
#   publish job packs;
# - the irreversible step sits behind the protected `npm-publish` environment, and the verify job checks that the
#   environment exists with required reviewers (GitHub silently creates a missing environment with no protection).
#   Required reviewers exist only for public repositories on personal plans, so this gate fails closed in a private
#   repository;
# - no long-lived token exists: publishing uses npm OIDC trusted publishing, and `id-token: write` is granted to the
#   publish job only. Provenance is attached automatically when the repository is public;
# - the dist-tag is checked against the version: a prerelease never becomes `latest`;
# - the five packages share one version and are published in dependency order; a package already on the registry at
#   that version is skipped only when its published tarball is byte-identical to this one, so a re-dispatch after a
#   partial failure finishes the set and never overwrites anything.
#
# profile/docs/releasing.md is the procedure of record, including the one-time prerequisites. This file and
# profile/ arrive together from the project's working repository (profile/README.md).
name: npm release (profile)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA to publish from, reachable from main
        required: true
      version:
        description: Must equal the version of all five library packages at that commit
        required: true
      dist-tag:
        description: npm dist-tag. `latest` for a stable version; a prerelease needs another, e.g. beta
        required: true
      stable-off-latest:
        description: Publish a stable version under a non-latest dist-tag (a backport)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: npm-release-profile-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the artifacts before anything irreversible
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate the input shapes
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
          STABLE_OFF_LATEST: ${{ inputs.stable-off-latest }}
        run: |
          set -euo pipefail
          # [[ =~ ]] matches the whole string; grep would match line by line and pass "0.1.0<newline>anything".
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "commit must be a full 40-character lowercase SHA" >&2; exit 1; }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "version must be semver, e.g. 0.1.0" >&2; exit 1; }
          [[ "${DIST_TAG}" =~ ^[a-z][a-z0-9-]*$ ]] \
            || { echo "dist-tag must be lowercase letters, digits and dashes, e.g. latest or beta" >&2; exit 1; }
          case "${VERSION}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          case "${STABLE_OFF_LATEST}" in
            true|false) ;;
            *) echo "stable-off-latest must be true or false" >&2; exit 1 ;;
          esac
          if [ "${prerelease}" = true ]; then
            if [ "${DIST_TAG}" = latest ]; then
              echo "${VERSION} is a prerelease; it must not be published as latest (use e.g. dist-tag=beta)" >&2
              exit 1
            fi
            if [ "${STABLE_OFF_LATEST}" = true ]; then
              echo "stable-off-latest applies to a stable version only; ${VERSION} is a prerelease" >&2
              exit 1
            fi
          elif [ "${DIST_TAG}" = latest ]; then
            if [ "${STABLE_OFF_LATEST}" = true ]; then
              echo "stable-off-latest was set but dist-tag is latest; drop one of them" >&2
              exit 1
            fi
          elif [ "${STABLE_OFF_LATEST}" != true ]; then
            echo "${VERSION} is a stable version and must be published as latest; under ${DIST_TAG} it needs stable-off-latest=true" >&2
            exit 1
          fi
          printf 'version %s -> prerelease=%s, dist-tag=%s\n' "${VERSION}" "${prerelease}" "${DIST_TAG}"

      - name: Confirm the publish environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviewers="$(gh api "repos/${REPO}/environments/npm-publish" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' \
            2>/dev/null || echo unreadable)"
          if [ "${reviewers}" = unreadable ]; then
            echo "cannot read the npm-publish environment; create it with required reviewers (docs/releasing.md)" >&2
            exit 1
          fi
          if [ "${reviewers}" -lt 1 ]; then
            echo "the npm-publish environment has no required reviewers; it is not a gate" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the commit is an ancestor of main
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "${COMMIT}" FETCH_HEAD \
            || { echo "${COMMIT} is not reachable from origin/main" >&2; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      - name: The packages are at the requested version, publishable, with dated changelog entries
        working-directory: profile
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/package-check/release-check.mjs "${VERSION}"

      - name: The checks of profile/
        working-directory: profile
        run: |
          set -euo pipefail
          npm ci
          npm run validate
          npm test
          npm run types
          npm run pack:check

  publish:
    name: Publish to npm (protected)
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      # Node 24.22.1 ships npm 11.19.1, above the 11.5.1 that OIDC trusted publishing needs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      - run: npm ci
        working-directory: profile

      - name: Publish in dependency order
        working-directory: profile
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          set -euo pipefail
          for dir in format resolver reconcile tools consent; do
            name="$(node -p "require('./packages/${dir}/package.json').name")"
            local_integrity="$(cd "packages/${dir}" && npm pack --dry-run --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].integrity)')"
            published="$(npm view "${name}@${VERSION}" dist.integrity 2>/dev/null || true)"
            if [ -n "${published}" ]; then
              if [ "${published}" = "${local_integrity}" ]; then
                echo "${name}@${VERSION} is already published with the same bytes; skipped"
                continue
              fi
              echo "${name}@${VERSION} is already published with other bytes (${published}); refusing" >&2
              exit 1
            fi
            (cd "packages/${dir}" && npm publish --access public --tag "${DIST_TAG}")
            echo "published ${name}@${VERSION} under ${DIST_TAG}"
          done
