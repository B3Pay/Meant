name: Benchmark comparison

# Informational, never a gate. This workflow measures a pull request's base
# and head one after the other, in one job on one runner, and reports what
# moved: a job summary on every run, and one bot-managed comment only when
# something did. It cannot fail a pull request for a timing or allocation
# delta — that is a recorded decision on issue #39, not an unfinished
# feature: GitHub-hosted runners are shared and thermally variable, so a
# threshold calibrated from their noise would produce a red check maintainers
# learn to ignore.
#
# Why base and head on one runner (issue #289, the plan of issue #256): a
# stored baseline is measured on another machine with another toolchain, so
# its deltas describe two machines as much as two revisions, and it goes
# stale with every toolchain release. Two runs minutes apart on one machine
# differ by the change alone in what they allocate, and by the change and that
# machine's noise in how long they take. `compare.py` counts any allocation
# difference as moved, and a timing delta only past the noise
# (docs/benchmarks.md, "What counts as moved").
#
# What *can* fail this workflow is the tooling itself breaking: the rules'
# tests, a build, or `compare.py` exiting with something other than 0 or 2.
# Exit 2, no comparison made, is an expected outcome the report states
# plainly: the two runs measured different things, as when a pull request
# changes the corpus.
#
# This lives in its own file, not in `Verify` or `Release candidate`, because
# commenting needs `pull-requests: write` and those two workflows deliberately
# hold nothing beyond `contents: read`. This one gains no ability to tag,
# publish, or write repository contents.

on:
  pull_request:
    # What the benchmarks build or read: the crate and its manifest and
    # lockfile, the benches and their corpus, the two conformance fixtures the
    # corpus includes, and this comparison's own tooling. A pull request that
    # changes none of them (documentation, the TypeScript generator, the
    # profile copy) gets no run. `test_compare.py` fails when a bench or the
    # crate includes a file this list misses, or an entry matches nothing.
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/fixtures/conformance/basic.did"
      - "tests/fixtures/conformance/recursive.did"
      - "tests/fixtures/benchmarks/**"
      - ".github/workflows/benchmark-compare.yml"

permissions:
  contents: read
  pull-requests: write

# One comparison per PR at a time; a superseded push cancels the older run —
# unlike a release, an outdated informational comparison has no value.
concurrency:
  group: benchmark-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare base and head on one runner
    runs-on: ubuntu-latest
    steps:
      # The pull request's test merge commit, with its parents. Its first
      # parent is the base it would merge into, so the two differ by exactly
      # what merging changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      # The head's tooling measures both sides, so one version of the rules
      # judges the comparison; a copy survives checking out the base below.
      - name: Test the comparison rules
        run: |
          set -euo pipefail
          python3 tests/fixtures/benchmarks/test_compare.py
          OUT="${RUNNER_TEMP}/comparison"
          mkdir -p "${OUT}/tools"
          cp tests/fixtures/benchmarks/compare.py "${OUT}/tools/"
          {
            echo "OUT=${OUT}"
            echo "HEAD_SHA=$(git rev-parse HEAD^2)"
            echo "MERGE_SHA=$(git rev-parse HEAD)"
            echo "BASE_SHA=$(git rev-parse HEAD^1)"
          } >> "${GITHUB_ENV}"
      # Base first, then head, in this one checkout: the same path, the same
      # target directory and the same environment on both sides, so nothing
      # but the code differs between the two binaries. Each side emits its
      # manifest before its suite (the manifest's mtime is the run epoch that
      # lets `compare.py` reject Criterion results from an earlier run) and
      # writes Criterion's results to its own directory. The full statistical
      # configuration, not a reduced one: comparing medians drawn from fewer
      # samples would add noise to a signal that already carries plenty.
      - name: Measure the base
        env:
          CRITERION_HOME: ${{ runner.temp }}/comparison/base/criterion
        run: |
          set -euo pipefail
          git checkout --quiet --detach "${BASE_SHA}"
          mkdir -p "${OUT}/base"
          cargo bench --bench manifest --locked > "${OUT}/base/manifest.json"
          cargo bench --bench compilation --locked -- --noplot
          cargo bench --bench allocation --locked > "${OUT}/base/allocations.json"
          python3 "${OUT}/tools/compare.py" capture --repo-root . \
            --manifest "${OUT}/base/manifest.json" \
            --criterion "${CRITERION_HOME}" \
            --allocations "${OUT}/base/allocations.json" \
            --out "${OUT}/base.json" \
            --note "base ${BASE_SHA}, measured by run ${GITHUB_RUN_ID}"
      - name: Measure the head
        env:
          CRITERION_HOME: ${{ runner.temp }}/comparison/head/criterion
        run: |
          set -euo pipefail
          git checkout --quiet --detach "${MERGE_SHA}"
          mkdir -p "${OUT}/head"
          cargo bench --bench manifest --locked > "${OUT}/head/manifest.json"
          cargo bench --bench compilation --locked -- --noplot
          cargo bench --bench allocation --locked > "${OUT}/head/allocations.json"
      # `--allow-environment-drift` because the one drift this job can see is
      # a dependency graph the pull request changes, which is part of what it
      # does; the report names it, and `compare.py` refuses to gate on it by
      # construction. Exit 0 (compared) and exit 2 (no comparison was made)
      # are both expected outcomes; anything else is the tool breaking and
      # fails the job.
      - name: Compare
        id: compare
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          status=0
          python3 "${OUT}/tools/compare.py" compare --repo-root . \
            --baseline "${OUT}/base.json" \
            --manifest "${OUT}/head/manifest.json" \
            --criterion "${OUT}/head/criterion" \
            --allocations "${OUT}/head/allocations.json" \
            --allow-environment-drift \
            --markdown "${OUT}/report.md" \
            --json "${OUT}/report.json" \
            > /dev/null 2> "${OUT}/refusal.txt" || status=$?
          if [ "${status}" -eq 2 ]; then
            {
              echo "# Benchmark comparison"
              echo
              echo "**No comparison was made.** The base and the head did not"
              echo "measure the same thing, so no delta between them would mean"
              echo "anything:"
              echo
              echo '```'
              cat "${OUT}/refusal.txt"
              echo '```'
            } > "${OUT}/report.md"
            moved=true
          elif [ "${status}" -ne 0 ]; then
            echo "compare.py failed with exit ${status}:" >&2
            cat "${OUT}/refusal.txt" >&2
            exit "${status}"
          else
            moved="$(python3 -c 'import json, sys; print(str(json.load(open(sys.argv[1]))["changes"]["any"]).lower())' "${OUT}/report.json")"
          fi
          # The title, then which commits these are, then the report.
          {
            head -n 1 "${OUT}/report.md"
            echo
            echo "Base \`${BASE_REF}\` at ${BASE_SHA}, head ${HEAD_SHA} (merged"
            echo "as ${MERGE_SHA}), measured one after the other on this runner."
            tail -n +2 "${OUT}/report.md"
          } > "${OUT}/comment.md"
          cat "${OUT}/comment.md" >> "${GITHUB_STEP_SUMMARY}"
          cat "${OUT}/comment.md"
          echo "moved=${moved}" >> "${GITHUB_OUTPUT}"
          echo "moved: ${moved}"
      # The raw data behind the report, for a reader who wants more than the
      # medians: both sides' Criterion estimates, manifests and allocations.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-comparison-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/comparison
          retention-days: 30
      # At most one comment per pull request, found by its marker. It is
      # created only when something moved; once it exists, every later run
      # updates it in place, so a comment about an earlier push never stands
      # after the pull request stopped moving anything. Skipped in the two
      # cases where the token is read-only regardless of the permissions
      # declared above — forks, and Dependabot, whose pull requests come from a
      # branch in *this* repository and so pass the repo-name check while
      # still carrying a read-only token. The job summary carries the report
      # in both cases. Any other token failure stays a hard failure on
      # purpose: a real permission misconfiguration should be seen, not
      # swallowed.
      - name: Update the pull-request comment
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MOVED: ${{ steps.compare.outputs.moved }}
        run: |
          set -euo pipefail
          marker='<!-- candid-core-benchmark-comparison -->'
          {
            echo "${marker}"
            cat "${OUT}/comment.md"
          } > "${OUT}/comment-body.md"
          existing="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\")) | .id] | first // empty")"
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" \
              -F body=@"${OUT}/comment-body.md" > /dev/null
            echo "updated comment ${existing}"
          elif [ "${MOVED}" = "true" ]; then
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" \
              -F body=@"${OUT}/comment-body.md" > /dev/null
            echo "created comment"
          else
            echo "nothing moved and no earlier comment: no comment"
          fi
